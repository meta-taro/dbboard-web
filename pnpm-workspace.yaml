packages:
  - "apps/*"

# Build-script allowlist (pnpm 11+).
#
# Default policy (AI_AGENT_RULES.md §11): deny all install/postinstall scripts.
# Explicit exceptions live here, each with a one-line reason. Add new entries
# only when a dependency genuinely cannot work without its build step, and
# review what the script does first.
allowBuilds:
  # NestJS vanity banner postinstall. Not required for runtime.
  "@nestjs/core": false
  # Native file-watcher used by Nuxt / Nitro dev mode. Required.
  "@parcel/watcher": true
  # SWC compiler used by unplugin-swc to emit decorator metadata for
  # NestJS DI in the API integration tests (vanilla esbuild drops it).
  # Postinstall verifies the native binary; build-time only.
  "@swc/core": true
  # Native CPU-feature detection, pulled in by ssh2 to pick a faster crypto
  # path. Optional by construction: ssh2 works without it, on its bundled JS
  # implementations. Kept denied now that ssh2 is a first-class dependency
  # (0031 slice D) — a tunnel that negotiates slightly slower is a better
  # trade than a node-gyp step in every install and CI job.
  cpu-features: false
  # esbuild downloads the platform-native binary on postinstall. Required by
  # Vite, Vitest, and Nuxt.
  esbuild: true
  # testcontainers transitive dep: protobuf compiler step. Prebuilt JS is
  # bundled and works at runtime; the install-time codegen is not needed.
  protobufjs: false
  # Native libvips bindings used by @vite-pwa/assets-generator to rasterize
  # the source SVG into PNG icons at build time. Build-time only, no runtime
  # surface.
  sharp: true
  # The SSH client behind `infrastructure/ssh-tunnel` (0031 slice D), and a
  # testcontainers transitive dep besides. Its install script is a node-gyp
  # rebuild of a *bundled optional* crypto binding: ssh2 prints "Failed to
  # build optional crypto binding" and carries on with its JS fallback, which
  # is what the tunnel and its suite run on today. Denied so that installing
  # this repo never needs a compiler.
  ssh2: false
  # Native module resolver used by ESLint / Nuxt; speeds up resolution and is
  # required for some plugins to load on Windows.
  unrs-resolver: true

# Supply-chain quarantine (pnpm 11+).
#
# Refuse to install package versions released in the last 1440 minutes (24 h).
# Mitigates dependency-confusion and post-publish-hijack attacks where a
# malicious version is pulled within minutes of being pushed.
minimumReleaseAge: 1440
